<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Walter Puzzle</title>
	<link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./pieces/3.svg">
	<script src="./thirdparty/scripts/html2canvas.min.js"></script>
</head>
<body>
	<h1>Walter Puzzle</h1>
	<div class="container">
		<div class="grid" id="grid">
			<div class="corner"><img src="./constraints/corner-top-left.svg" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'top')"><img id="top-0" src="./constraints/horizontal-off.svg" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'top')"><img id="top-1" src="./constraints/horizontal-off.svg" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'top')"><img id="top-2" src="./constraints/horizontal-off.svg" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'top')"><img id="top-3" src="./constraints/horizontal-off.svg" /></div>
			<div class="corner"><img src="./constraints/corner-top-right.svg" /></div>

			<div class="vertical-constraint" onclick="toggleConstraint(this, 'left')"><img id="left-0" src="./constraints/vertical-off.svg" /></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="0-0"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="0-1"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="0-2"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="0-3"></div>
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'right')"><img id="right-0" src="./constraints/vertical-off.svg" class="mirror-horizontal" /></div>
			
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'left')"><img id="left-1" src="./constraints/vertical-off.svg" /></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="1-0"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="1-1"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="1-2"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="1-3"></div>
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'right')"><img id="right-1" src="./constraints/vertical-off.svg" class="mirror-horizontal" /></div>
			
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'left')"><img id="left-2" src="./constraints/vertical-off.svg" /></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="2-0"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="2-1"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="2-2"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="2-3"></div>
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'right')"><img id="right-2" src="./constraints/vertical-off.svg" class="mirror-horizontal" /></div>
			
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'left')"><img id="left-3" src="./constraints/vertical-off.svg" /></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="3-0"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="3-1"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="3-2"></div>
			<div class="cell" ondragover="dragOver(event)" ondrop="drop(event)" id="3-3"></div>
			<div class="vertical-constraint" onclick="toggleConstraint(this, 'right')"><img id="right-3" src="./constraints/vertical-off.svg" class="mirror-horizontal" /></div>

			<div class="corner"><img src="./constraints/corner-bottom-left.svg" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'bottom')"><img id="bottom-0" src="./constraints/horizontal-off.svg" class="mirror-vertical" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'bottom')"><img id="bottom-1" src="./constraints/horizontal-off.svg" class="mirror-vertical" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'bottom')"><img id="bottom-2" src="./constraints/horizontal-off.svg" class="mirror-vertical" /></div>
			<div class="horizontal-constraint" onclick="toggleConstraint(this, 'bottom')"><img id="bottom-3" src="./constraints/horizontal-off.svg" class="mirror-vertical" /></div>
			<div class="corner"><img src="./constraints/corner-bottom-right.svg" /></div>
		</div>
		<div class="image-list" id="imageList">
			<!-- Images will be added here -->
		</div>
	</div>
	<div class="controls">
		<button id="solve" onclick="solveButton()">Solve</button>
		<button id="count" onclick="countButton()">Count solutions</button>
		<button id="save" onclick="saveButton()">Save</button>
		<button id="reset" onclick="resetButton()">Reset</button><br />
		<span id="counting">Counting the solutions, this may take a while...</span>	
	</div>
	<div id="saved-puzzles"></div>

	<canvas id="canvas"></canvas>

	<script src="./scripts/game.js"></script>
	<script src="./scripts/motion.js"></script>
	<script src="./scripts/htmlPuzzleBridge.js"></script>
    <script>
        let puzzle = new WalterPuzzle();
		loadFromHash();
		displaySavedPuzzles();
    </script>
</body>
</html>
